<div class="admin-shell">
  <!-- Sidebar -->
  @if (layout.isSidebarOpen()) {
  <div class="sidebar-backdrop" (click)="layout.toggleSidebar()"></div>
  }

  <app-sidebar></app-sidebar>

  <!-- Content Wrapper -->
  <div class="content-wrapper" [style.marginLeft]="layout.sidebarWidth()">
    <!-- Navbar -->
    <app-navbar></app-navbar>

    <!-- Content Area -->
    <main class="main-container" role="main">
      <div class="view-content">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>&copy; 2026 Dental Sonrisana V 1.0.0</p>
    </footer>
  </div>

  <app-appointment-drawer [isOpen]="layout.isAppointmentDrawerOpen()" (close)="layout.closeAppointmentDrawer()"
    (saved)="onAppointmentSaved($event)">
  </app-appointment-drawer>

  <app-config-drawer [isOpen]="layout.isConfigOpen()"></app-config-drawer>

  <app-confirmation-drawer></app-confirmation-drawer>
  <app-rejection-drawer></app-rejection-drawer>
  <app-cancellation-drawer></app-cancellation-drawer>

  <app-audit-drawer [isOpen]="layout.isAuditOpen()" (close)="layout.closeAuditDrawer()">
  </app-audit-drawer>

  <app-profile-drawer></app-profile-drawer>

  @if (loading.isLoading()) {
  <div class="global-loader" role="status" aria-label="Cargando">
    <div class="loader-backdrop"></div>
    <div class="loader-body">
      <div class="loader-rings">
        <span class="ring r1"></span>
        <span class="ring r2"></span>
        <span class="ring r3"></span>
      </div>
      <img src="/images/logo_erm.png" class="loader-iso" alt="">
      <span class="loader-label">Cargando...</span>
    </div>
  </div>
  }
</div>
