<aside class="sidebar" [style.width]="layout.sidebarWidth()" [class.collapsed]="!layout.isSidebarOpen()" role="complementary">
  <div class="sidebar-header">
    <div class="logo-container">
      <div class="logo-icon">
        <img src="images/logo_erm.png" alt="Novatia Logo" class="brand-logo">
      </div>
      <div class="logo-text">
        <span class="main-text">Novatia</span>
        <span class="sub-text">Health</span>
      </div>
      @if (auth.currentUser()?.planSuscripcion; as plan) {
        <div class="plan-badge" [class]="plan.toLowerCase()">
          {{ plan }}
        </div>
      }
    </div>
  </div>

    <nav class="nav-links">
      @for (item of filteredMenuItems; track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item"
        [title]="item.label" (click)="layout.closeSidebar()">
        <span class="icon">
          <i [class]="item.icon"></i>
        </span>
        <span class="label">{{ item.label }}</span>
      </a>
      }
    </nav>

  <div class="sidebar-footer">
    <button class="new-btn" title="Nueva Cita" (click)="layout.toggleAppointmentDrawer()">
      <span class="icon">+</span>
      <span class="label">Nueva Cita</span>
    </button>

    @if (auth.getUserRole() === 'OWNER' && auth.currentUser()?.planSuscripcion !== 'RED') {
      <a href="https://wa.me/529991234567?text=Hola,%20me%20gustaria%20mejorar%20mi%20plan%20en%20Novatia%20Health" 
         target="_blank" class="upgrade-btn" title="Mejorar Plan">
        <span class="icon">🚀</span>
        <span class="label">Mejorar Plan</span>
      </a>
    }
    <button class="logout-btn" title="Cerrar Sesión" (click)="logout()">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </span>
      <span class="label">Cerrar Sesión</span>
    </button>
  </div>
</aside>
